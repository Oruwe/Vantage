[project]
name = "vantage"
version = "0.1.0"
description = "Vantage — developer-first engineering journal with opt-in manager visibility"
readme = "README.md"
authors = [
    { name = "Triven", email = "triven0369@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ghost-daemon",
    "shadow-replica",
]

[tool.uv.sources]
ghost-daemon = { workspace = true }
shadow-replica = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/ghost-daemon",
    "packages/shadow-replica",
    "packages/employer-voice",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E9", "F401", "F811", "F821"]