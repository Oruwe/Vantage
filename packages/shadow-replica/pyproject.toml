[project]
name = "shadow-replica"
version = "0.1.0"
description = "Vantage shadow replica — subscriber service for receiving approved developer artifacts"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Triven", email = "triven0369@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "vantage",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.54.0",
    "typer>=0.16.0",
    "python-multipart>=0.0.20",
    "prometheus-client>=0.21.0",
]

[tool.uv.sources]
vantage = { workspace = true }

[project.scripts]
shadow-replica = "shadow_replica.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
