<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage · Manager Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --glow-opacity { syntax:'<number>'; inherits:false; initial-value:0; }
@property --ring-dash    { syntax:'<number>'; inherits:false; initial-value:0; }

@layer reset,tokens,base,layout,components,anims,utils;

@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button{font:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font:inherit;outline:none}
  ul{list-style:none}
}

@layer tokens {
  :root {
    --bg:        oklch(10% .020 255);
    --sf:        oklch(14% .025 255);
    --sf2:       oklch(17% .028 255);
    --sf3:       oklch(20% .030 255);
    --bd:        oklch(24% .028 255);
    --bd2:       oklch(29% .033 255);

    --p:         oklch(63% .200 280);
    --p2:        oklch(70% .200 280);
    --pbg:       oklch(63% .200 280/.10);
    --pbd:       oklch(63% .200 280/.28);
    --pglow:     oklch(63% .200 280/.30);

    --em:        oklch(72% .175 165);
    --embg:      oklch(72% .175 165/.10);
    --embd:      oklch(72% .175 165/.28);
    --emglow:    oklch(72% .175 165/.30);

    --am:        oklch(78% .160  75);
    --ambg:      oklch(78% .160  75/.10);
    --ambd:      oklch(78% .160  75/.28);

    --vi:        oklch(72% .195 300);
    --vibg:      oklch(72% .195 300/.10);
    --vibd:      oklch(72% .195 300/.28);

    --te:        oklch(80% .145 195);
    --tebg:      oklch(80% .145 195/.10);
    --tebd:      oklch(80% .145 195/.28);
    --teglow:    oklch(80% .145 195/.35);

    --re:        oklch(65% .195  25);
    --rebg:      oklch(65% .195  25/.10);
    --rebd:      oklch(65% .195  25/.28);

    --tx:        oklch(94% .010 255);
    --tx2:       oklch(72% .022 255);
    --tx3:       oklch(46% .018 255);

    --r:8px; --rl:12px; --rxl:16px;
    --sh:0 4px 20px oklch(0% 0 0/.50);
    --shl:0 8px 48px oklch(0% 0 0/.65);
    --font:'Geist',system-ui,sans-serif;
    --mono:'Geist Mono','JetBrains Mono',monospace;
    --sw:220px; --th:52px;
  }
}

@layer base {
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::selection{background:var(--pbg);color:var(--p2)}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px}

  /* Animated grid backdrop */
  .grid-bg{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--bd) 1px,transparent 1px),
                     linear-gradient(90deg,var(--bd) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,black 40%,transparent 100%);
    opacity:.35;
    animation:grid-drift 24s linear infinite;
  }
  @keyframes grid-drift{
    from{background-position:0 0,0 0}
    to  {background-position:0 48px,48px 0}
  }
}

/* ══ LOGIN ══════════════════════════════════════════════════════════════ */
@layer components {
  #login{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
  }
  #login::before,#login::after{
    content:'';position:absolute;border-radius:50%;pointer-events:none;
  }
  #login::before{
    width:800px;height:800px;
    background:radial-gradient(circle,oklch(63% .200 280/.07) 0%,oklch(72% .195 300/.04) 50%,transparent 70%);
    animation:aurora 14s ease-in-out infinite alternate;
  }
  #login::after{
    width:500px;height:500px;
    background:radial-gradient(circle,oklch(80% .145 195/.05) 0%,transparent 65%);
    animation:aurora 10s ease-in-out infinite alternate-reverse;
  }
  @keyframes aurora{
    from{transform:rotate(0deg) scale(1) translate(-10%,-5%)}
    to  {transform:rotate(20deg) scale(1.25) translate(5%,8%)}
  }

  .login-card{
    position:relative;z-index:1;width:390px;
    background:var(--sf);border:1px solid var(--bd);
    border-radius:var(--rxl);padding:44px;text-align:center;
    box-shadow:var(--shl);
    animation:card-up .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes card-up{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

  .lg-gem{
    width:60px;height:60px;
    background:linear-gradient(135deg,var(--p),var(--vi));
    border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    font-size:28px;font-weight:800;color:white;
    box-shadow:0 0 40px var(--pglow),0 0 80px var(--pbg);
    animation:gem-breathe 3.5s ease-in-out infinite;
  }
  @keyframes gem-breathe{
    0%,100%{box-shadow:0 0 40px var(--pglow),0 0 80px var(--pbg)}
    50%    {box-shadow:0 0 64px var(--pglow),0 0 120px var(--pbg)}
  }
  .lg-title{font-size:24px;font-weight:700;margin-bottom:4px}
  .lg-sub{font-size:13px;color:var(--tx3);margin-bottom:36px}
  .lg-input{
    width:100%;padding:12px 14px;background:var(--bg);
    border:1px solid var(--bd);border-radius:var(--r);
    color:var(--tx);font-family:var(--mono);font-size:13px;
    margin-bottom:12px;transition:border-color .2s,box-shadow .2s;
  }
  .lg-input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pbg)}
  .lg-input::placeholder{font-family:var(--font);color:var(--tx3)}
  .lg-btn{
    width:100%;padding:12px;
    background:linear-gradient(135deg,var(--p),oklch(58% .200 280));
    color:white;border-radius:var(--r);
    font-size:14px;font-weight:600;
    transition:all .15s;
    box-shadow:0 2px 16px var(--pbg);
  }
  .lg-btn:hover{filter:brightness(1.12);box-shadow:0 4px 24px var(--pglow)}
  .lg-btn:active{transform:scale(.98)}
  .lg-err{min-height:20px;margin-top:10px;font-size:13px;color:var(--re)}
  .lg-foot{margin-top:24px;font-size:12px;color:var(--tx3)}
}

/* ══ APP SHELL ══════════════════════════════════════════════════════════ */
@layer layout {
  #app{height:100vh;display:flex;flex-direction:column;position:relative}

  /* Topbar */
  #topbar{
    height:var(--th);
    background:oklch(14% .025 255/.88);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--bd);
    display:flex;align-items:center;gap:16px;padding:0 20px;
    flex-shrink:0;z-index:20;
  }
  .t-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.05em;cursor:pointer}
  .t-gem{
    width:28px;height:28px;
    background:linear-gradient(135deg,var(--p),var(--vi));
    border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:white;
    box-shadow:0 0 14px var(--pglow);
  }
  .t-sep{flex:1}
  .t-right{display:flex;align-items:center;gap:12px}

  .live-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--embg);border:1px solid var(--embd);
    border-radius:20px;padding:3px 10px;
    color:var(--em);font-size:12px;font-weight:500;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--em);animation:breathe 2.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

  /* Refresh ring */
  .refresh-wrap{position:relative;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .refresh-wrap:hover .ring-track{stroke:var(--bd2)}
  #ring-svg{transform:rotate(-90deg)}
  .ring-track{stroke:var(--bd);stroke-width:2.5;fill:none}
  .ring-prog{stroke:var(--p);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:75.4;stroke-dashoffset:75.4;transition:stroke-dashoffset .5s linear}
  .ring-icon{position:absolute;color:var(--tx3);transition:color .15s}
  .refresh-wrap:hover .ring-icon{color:var(--tx2)}

  .t-clock{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .icon-btn{
    width:32px;height:32px;border:1px solid var(--bd);border-radius:7px;
    display:flex;align-items:center;justify-content:center;color:var(--tx3);
    transition:all .15s;
  }
  .icon-btn:hover{background:var(--sf2);color:var(--tx);border-color:var(--bd2)}

  /* Shell */
  #shell{flex:1;display:flex;overflow:hidden;position:relative}

  /* Sidebar */
  #sidebar{
    width:var(--sw);
    background:oklch(14% .025 255/.65);backdrop-filter:blur(10px);
    border-right:1px solid var(--bd);
    display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;z-index:10;
  }
  .sb-sec{padding:14px 10px 6px}
  .sb-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:0 8px;margin-bottom:4px}
  .sb-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:7px;
    color:var(--tx2);font-size:13.5px;
    border:1px solid transparent;
    transition:background .12s,color .12s,border-color .12s;cursor:pointer;
  }
  .sb-item:hover{background:var(--sf2);color:var(--tx)}
  .sb-item.active{background:var(--pbg);border-color:var(--pbd);color:var(--p2)}
  .sb-av{
    width:24px;height:24px;border-radius:50%;
    background:var(--sf3);display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;color:var(--tx2);flex-shrink:0;position:relative;
  }
  .sb-av.on::after{content:'';position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;background:var(--em);border-radius:50%;border:1.5px solid var(--sf)}
  .sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-n{font-size:11px;color:var(--tx3);background:var(--sf3);border-radius:10px;padding:1px 6px;flex-shrink:0}
  .sb-hr{height:1px;background:var(--bd);margin:8px 12px}
  .sb-action{
    display:flex;align-items:center;gap:10px;
    padding:9px 18px;cursor:pointer;color:var(--tx2);font-size:13.5px;
    transition:all .12s;
  }
  .sb-action:hover{background:var(--sf2);color:var(--tx)}

  /* Main content */
  #content{flex:1;overflow-y:auto;padding:28px 36px;background:var(--bg);position:relative}
}

/* ══ STAT CARDS ══════════════════════════════════════════════════════════ */
@layer components {
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .stat-card{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);
    padding:18px 20px;position:relative;overflow:hidden;
    transition:border-color .2s,box-shadow .2s;
  }
  .stat-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--pbg),transparent);
    opacity:0;transition:opacity .3s;
  }
  .stat-card:hover{border-color:var(--bd2);box-shadow:var(--sh)}
  .stat-card:hover::before{opacity:1}
  .sc-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:10px}
  .sc-val{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .sc-val.green{color:var(--em)}
  .sc-val sub{font-size:14px;font-weight:400;color:var(--tx3)}
  .sc-trend{display:flex;align-items:center;gap:4px;font-size:11.5px;margin-top:6px}
  .sc-trend.up{color:var(--em)}
  .sc-trend.dn{color:var(--re)}
  .sc-trend.flat{color:var(--tx3)}
}

/* ══ WORKING NOW ═════════════════════════════════════════════════════════ */
@layer components {
  .wn-section{margin-bottom:28px}
  .wn-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .wn-title{font-size:13px;font-weight:600;color:var(--tx2)}
  .wn-live{
    display:flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:700;letter-spacing:.08em;
    color:var(--em);text-transform:uppercase;
  }
  .wn-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--em);animation:breathe 2s infinite}
  .wn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .wn-card{
    background:var(--sf);border:1px solid var(--embd);border-radius:var(--rl);
    padding:16px 18px;position:relative;overflow:hidden;
    box-shadow:0 0 20px var(--emglow);
    animation:wn-in .4s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes wn-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .wn-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--em),transparent);
    animation:shimmer 2.5s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{opacity:.4}50%{opacity:1}}
  .wn-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .wn-av{
    width:36px;height:36px;border-radius:50%;
    background:var(--embg);border:2px solid var(--embd);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--em);flex-shrink:0;
    box-shadow:0 0 12px var(--emglow);
  }
  .wn-name{font-size:14px;font-weight:600}
  .wn-status{font-size:11.5px;color:var(--em)}
  .wn-rows{display:flex;flex-direction:column;gap:6px}
  .wn-row{display:flex;align-items:flex-start;gap:8px;font-size:12.5px}
  .wn-row-lbl{color:var(--tx3);min-width:36px;flex-shrink:0;padding-top:1px}
  .wn-row-val{color:var(--tx2);font-family:var(--mono);font-size:11.5px;word-break:break-all;line-height:1.5}
  .wn-row-val.plain{font-family:var(--font);font-size:12.5px}
  .wn-footer{margin-top:12px;display:flex;justify-content:flex-end}
  .wn-prob-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:500;color:var(--te);
    background:var(--tebg);border:1px solid var(--tebd);
    border-radius:6px;padding:4px 12px;
    transition:all .15s;
  }
  .wn-prob-btn:hover{background:var(--te);color:var(--bg)}

  /* Loading skeleton for wn */
  .wn-skeleton{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 18px;
  }
  .sk-line{height:12px;background:var(--sf2);border-radius:6px;margin-bottom:8px;animation:sk-pulse 1.5s ease-in-out infinite}
  .sk-line.short{width:60%}
  .sk-line.med{width:80%}
  @keyframes sk-pulse{0%,100%{opacity:.4}50%{opacity:.9}}
}

/* ══ DEV CARDS ═══════════════════════════════════════════════════════════ */
@layer components {
  .ph{margin-bottom:24px}
  .ph-title{font-size:20px;font-weight:700;margin-bottom:3px}
  .ph-sub{font-size:13px;color:var(--tx3)}
  .sec-hdr{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:12px}
  .sec-hdr .muted{font-size:11px;color:var(--tx3);font-weight:400}

  .dev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:32px}
  .dev-card{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);
    padding:20px;cursor:pointer;
    transition:all .22s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;
  }
  .dev-card::after{
    content:'';position:absolute;inset:-1px;border-radius:inherit;
    border:1px solid transparent;pointer-events:none;
    transition:border-color .25s;
  }
  .dev-card:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--bd2)}
  .dev-card:hover::after{border-color:var(--pbd)}

  .dc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .dc-av{
    width:42px;height:42px;border-radius:50%;
    background:var(--pbg);border:1.5px solid var(--pbd);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:var(--p2);flex-shrink:0;position:relative;
    transition:all .2s;
  }
  .dc-av.on{background:var(--embg);border-color:var(--embd);color:var(--em);box-shadow:0 0 18px var(--emglow)}
  .dc-av.on::after{content:'';position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:var(--em);border-radius:50%;border:2px solid var(--sf)}
  .dc-name{font-size:15px;font-weight:600;margin-bottom:2px}
  .dc-status{font-size:12px;color:var(--tx3)}
  .dc-status.on{color:var(--em)}

  /* Sparkline */
  .dc-spark{margin-bottom:12px}
  .dc-spark-lbl{font-size:10px;color:var(--tx3);margin-bottom:5px}

  /* Channel distribution bars */
  .ch-dist{margin-bottom:14px;display:flex;flex-direction:column;gap:5px}
  .ch-dist-row{display:flex;align-items:center;gap:8px}
  .ch-dist-bar-wrap{flex:1;height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
  .ch-dist-bar{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}
  .ch-dist-pct{font-size:11px;color:var(--tx3);min-width:28px;text-align:right}

  .dc-actions{display:flex;gap:8px;margin-top:14px}
  .btn-sm{
    flex:1;padding:6px 12px;border-radius:6px;
    font-size:12px;font-weight:500;text-align:center;
    border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);
    cursor:pointer;transition:all .15s;
  }
  .btn-sm:hover{background:var(--sf3);color:var(--tx)}
  .btn-sm.primary{background:var(--pbg);border-color:var(--pbd);color:var(--p2)}
  .btn-sm.primary:hover{background:var(--p);color:white}
  .btn-sm:disabled{opacity:.35;cursor:not-allowed}
  .btn-sm.teal{background:var(--tebg);border-color:var(--tebd);color:var(--te)}
  .btn-sm.teal:hover{background:var(--te);color:var(--bg)}
}

/* ══ ACTIVITY FEED ══════════════════════════════════════════════════════ */
@layer components {
  .act-list{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden}
  .act-item{
    display:flex;align-items:center;gap:12px;padding:11px 18px;
    border-bottom:1px solid var(--bd);cursor:pointer;
    transition:background .12s;
    border-left:3px solid transparent;
  }
  .act-item:last-child{border-bottom:none}
  .act-item:hover{background:var(--sf2)}
  .act-item.ch-commit {border-left-color:var(--em)}
  .act-item.ch-digest {border-left-color:var(--p2)}
  .act-item.ch-standup{border-left-color:var(--am)}
  .act-item.ch-pr     {border-left-color:var(--vi)}
  .act-item.ch-probe  {border-left-color:var(--te)}
  .act-av{
    width:28px;height:28px;border-radius:50%;background:var(--sf3);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:var(--tx2);flex-shrink:0;
  }
  .act-name{font-size:13px;font-weight:500;min-width:88px;white-space:nowrap}
  .act-sum{flex:1;font-size:13px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act-time{font-size:11.5px;color:var(--tx3);flex-shrink:0}
}

/* ══ BADGES ═════════════════════════════════════════════════════════════ */
@layer components {
  .badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;flex-shrink:0}
  .b-commit {background:var(--embg);color:var(--em);border:1px solid var(--embd)}
  .b-digest {background:var(--pbg); color:var(--p2);border:1px solid var(--pbd)}
  .b-standup{background:var(--ambg);color:var(--am);border:1px solid var(--ambd)}
  .b-pr     {background:var(--vibg);color:var(--vi);border:1px solid var(--vibd)}
  .b-probe  {background:var(--tebg);color:var(--te);border:1px solid var(--tebd)}
  .b-default{background:var(--sf3); color:var(--tx2);border:1px solid var(--bd)}
}

/* ══ DEVELOPER DETAIL ═══════════════════════════════════════════════════ */
@layer components {
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--tx3);cursor:pointer;
    padding:4px 8px;border-radius:6px;margin-bottom:16px;transition:all .12s;
  }
  .back-btn:hover{color:var(--tx2);background:var(--sf)}

  .dev-hdr{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .dev-av-xl{
    width:52px;height:52px;border-radius:50%;
    background:var(--pbg);border:2px solid var(--pbd);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:var(--p2);flex-shrink:0;position:relative;
  }
  .dev-av-xl.on{
    background:var(--embg);border-color:var(--embd);color:var(--em);
    box-shadow:0 0 28px var(--emglow);
  }
  .dev-av-xl.on::after{content:'';position:absolute;bottom:2px;right:2px;width:13px;height:13px;background:var(--em);border-radius:50%;border:2.5px solid var(--bg)}
  .dev-hdr-info .dn{font-size:20px;font-weight:700;margin-bottom:2px}
  .dev-hdr-info .dm{font-size:13px;color:var(--tx3)}
  .dev-hdr-info .dm.on{color:var(--em)}
  .dev-hdr-right{margin-left:auto;display:flex;gap:10px;align-items:center}

  /* 14-day activity chart */
  .act-chart{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);
    padding:18px 20px;margin-bottom:20px;
  }
  .act-chart-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .act-chart-svg{width:100%;display:block}

  /* Channel dist full */
  .ch-dist-full{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);
    padding:18px 20px;margin-bottom:20px;
  }
  .ch-dist-full-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:14px}
  .ch-dist-full-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .ch-dist-full-row:last-child{margin-bottom:0}
  .ch-dist-full-bar-wrap{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
  .ch-dist-full-bar{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
  .ch-dist-full-pct{font-size:12px;color:var(--tx3);min-width:36px;text-align:right}
  .ch-dist-full-count{font-size:11.5px;color:var(--tx3);min-width:24px}

  /* Channel tabs */
  .ch-tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:20px}
  .ch-tab{
    padding:7px 14px;font-size:13px;font-weight:500;color:var(--tx3);
    border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:none;
    margin-bottom:-1px;cursor:pointer;transition:all .15s;
  }
  .ch-tab:hover{color:var(--tx2)}
  .ch-tab.active{color:var(--p2);background:var(--bg);border-color:var(--bd);border-bottom-color:var(--bg)}

  /* Timeline */
  .tl-list{display:flex;flex-direction:column;gap:10px}
  .tl-item{
    background:var(--sf);border:1px solid var(--bd);
    border-radius:var(--rl);padding:16px 20px;cursor:pointer;
    transition:all .2s cubic-bezier(.16,1,.3,1);
    border-left:3px solid transparent;
  }
  .tl-item.ch-commit {border-left-color:var(--em)}
  .tl-item.ch-digest {border-left-color:var(--p2)}
  .tl-item.ch-standup{border-left-color:var(--am)}
  .tl-item.ch-pr     {border-left-color:var(--vi)}
  .tl-item.ch-probe  {border-left-color:var(--te)}
  .tl-item:hover{border-top-color:var(--bd2);border-right-color:var(--bd2);border-bottom-color:var(--bd2);background:var(--sf2);transform:translateX(2px)}
  .tl-hdr{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .tl-type{font-size:12px;color:var(--tx3)}
  .tl-time{margin-left:auto;font-size:11.5px;color:var(--tx3)}
  .tl-sum{font-size:13.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Probe button */
  .probe-btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--tebg);border:1px solid var(--tebd);border-radius:7px;
    padding:7px 14px;font-size:13px;font-weight:500;color:var(--te);
    cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
  }
  .probe-btn::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(circle at center,var(--teglow) 0%,transparent 70%);
    opacity:0;transition:opacity .3s;
  }
  .probe-btn:hover{background:var(--te);color:var(--bg);border-color:var(--te);box-shadow:0 0 24px var(--teglow)}
  .probe-btn:hover::after{opacity:1}
  .probe-btn:disabled{opacity:.35;cursor:not-allowed}
  .probe-btn:disabled:hover{background:var(--tebg);color:var(--te);box-shadow:none}

  /* Loading / empty */
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:64px;color:var(--tx3);font-size:13px}
  .spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2);border-top-color:var(--p);animation:spin .65s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:56px 24px}
  .empty-ico{font-size:36px;margin-bottom:14px;opacity:.35}
  .empty-ttl{font-size:15px;font-weight:600;color:var(--tx2);margin-bottom:6px}
  .empty-txt{font-size:13px;color:var(--tx3)}
}

/* ══ MODAL ══════════════════════════════════════════════════════════════ */
@layer components {
  #modal{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:oklch(10% .020 255/.82);backdrop-filter:blur(10px);
    animation:fi .2s ease;
  }
  @keyframes fi{from{opacity:0}}
  .modal-box{
    background:var(--sf);border:1px solid var(--bd);border-radius:var(--rxl);
    width:100%;max-width:720px;max-height:calc(100vh - 48px);
    display:flex;flex-direction:column;
    box-shadow:var(--shl);
    animation:mi .3s cubic-bezier(.16,1,.3,1);
  }
  @keyframes mi{from{opacity:0;transform:scale(.95) translateY(12px)}}
  .m-head{
    display:flex;align-items:center;gap:10px;padding:18px 22px;
    border-bottom:1px solid var(--bd);flex-shrink:0;
  }
  .m-title{flex:1;font-size:15px;font-weight:600}
  .m-close{
    width:28px;height:28px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--tx3);transition:all .12s;
  }
  .m-close:hover{background:var(--sf2);color:var(--tx)}
  .m-body{padding:22px;overflow-y:auto;flex:1}

  /* Artifact sections */
  .a-sec{margin-bottom:18px}
  .a-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
  .a-lbl.warn{color:var(--am)}
  .a-lbl.danger{color:var(--re)}
  .a-text{font-size:13.5px;color:var(--tx2);line-height:1.75}
  .a-title{font-size:16px;font-weight:600;color:var(--tx);line-height:1.4}
  .a-list{display:flex;flex-direction:column;gap:7px}
  .a-list li{display:flex;gap:10px;font-size:13.5px;color:var(--tx2);line-height:1.5;align-items:flex-start}
  .a-list li::before{content:'–';color:var(--tx3);flex-shrink:0;margin-top:1px}
  .a-list li.warn::before{color:var(--am)}
  .a-list li.danger::before{color:var(--re)}
  .a-code-block{
    position:relative;background:var(--bg);border:1px solid var(--bd);
    border-radius:7px;padding:12px 14px;
    font-family:var(--mono);font-size:12px;color:var(--p2);
    overflow-x:auto;white-space:pre-wrap;word-break:break-all;
  }
  .copy-btn{
    position:absolute;top:8px;right:8px;
    font-size:11px;font-weight:500;color:var(--tx3);
    background:var(--sf2);border:1px solid var(--bd);border-radius:5px;
    padding:2px 8px;cursor:pointer;transition:all .12s;
  }
  .copy-btn:hover{color:var(--tx);border-color:var(--bd2)}
  .copy-btn.copied{color:var(--em);border-color:var(--embd)}

  /* File tags */
  .file-tags{display:flex;flex-wrap:wrap;gap:6px}
  .file-tag{
    font-family:var(--mono);font-size:11.5px;
    background:var(--bg);border:1px solid var(--bd);border-radius:4px;
    padding:2px 8px;color:var(--tx2);
    transition:border-color .15s;
  }
  .file-tag:hover{border-color:var(--bd2);color:var(--tx)}

  /* Metadata row */
  .a-meta{display:flex;flex-wrap:wrap;gap:16px;padding-top:14px;margin-top:6px;border-top:1px solid var(--bd)}
  .a-mi{display:flex;flex-direction:column;gap:3px}
  .a-ml{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
  .a-mv{font-size:13px;color:var(--tx)}
  .a-mv code{font-family:var(--mono);font-size:11.5px;background:var(--bg);padding:1px 5px;border-radius:4px}

  /* Probe view */
  .probe-status{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);margin-bottom:18px;font-weight:500}
  .ps-ok {background:var(--embg);border:1px solid var(--embd);color:var(--em)}
  .ps-no {background:var(--rebg);border:1px solid var(--rebd);color:var(--re)}
  .ps-off{background:var(--ambg);border:1px solid var(--ambd);color:var(--am)}
  .turn-list{display:flex;flex-direction:column;gap:8px}
  .turn{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px}
  .turn-role{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
  .tr-user{color:var(--p2)}
  .tr-assistant{color:var(--em)}
  .tr-tool{color:var(--te)}
  .turn-body{font-size:13px;color:var(--tx2);line-height:1.5;white-space:pre-wrap}
  .turn-ts{font-size:10.5px;color:var(--tx3);margin-top:4px}

  /* Activity signals */
  .probe-act{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
  .probe-act-row{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .probe-act-row:last-child{margin-bottom:0}
  .pa-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);flex-shrink:0;width:66px}
  .pa-val{font-size:13px;color:var(--tx2);flex:1;min-width:0}
  .pa-intent{font-size:12.5px;color:var(--tx3);font-style:italic;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
  .act-editing  {background:var(--embg);color:var(--em);border:1px solid var(--embd)}
  .act-debugging{background:var(--ambg);color:var(--am);border:1px solid var(--ambd)}
  .act-reviewing{background:var(--pbg); color:var(--p2);border:1px solid var(--pbd)}
  .act-browsing {background:var(--tebg);color:var(--te);border:1px solid var(--tebd)}
  .act-unknown  {background:var(--sf3); color:var(--tx3);border:1px solid var(--bd)}
}

/* ══ QUERY PANEL ════════════════════════════════════════════════════════ */
@layer components {
  #qpanel{
    position:fixed;right:0;top:var(--th);bottom:0;width:400px;
    background:oklch(14% .025 255/.92);backdrop-filter:blur(18px);
    border-left:1px solid var(--bd);
    display:flex;flex-direction:column;z-index:40;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
    box-shadow:-4px 0 28px oklch(0% 0 0/.40);
  }
  #qpanel.open{transform:none}
  .qp-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
  .qp-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .qp-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .qmsg-role{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:4px}
  .qbubble{padding:10px 14px;font-size:13.5px;line-height:1.6;border-radius:10px;word-break:break-word;animation:bb .2s cubic-bezier(.16,1,.3,1)}
  @keyframes bb{from{opacity:0;transform:translateY(6px) scale(.97)}}
  .qmsg.you .qmsg-role{text-align:right}
  .qmsg.you  .qbubble{background:var(--pbg);border:1px solid var(--pbd);color:var(--tx);border-radius:10px 10px 4px 10px;margin-left:24px}
  .qmsg.ai   .qbubble{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);border-radius:10px 10px 10px 4px;margin-right:24px}
  .qp-foot{padding:12px 16px;border-top:1px solid var(--bd);flex-shrink:0}
  .qp-sel{width:100%;margin-bottom:8px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:5px 10px;color:var(--tx2);font-size:12px;transition:border-color .15s}
  .qp-sel:focus{border-color:var(--p)}
  .qp-row{display:flex;gap:8px;align-items:flex-end}
  .qp-ta{
    flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:8px;
    padding:9px 12px;color:var(--tx);font-size:13.5px;resize:none;line-height:1.5;
    max-height:120px;min-height:40px;transition:border-color .15s,box-shadow .15s;
  }
  .qp-ta:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pbg)}
  .qp-send{
    width:38px;height:38px;flex-shrink:0;background:var(--p);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:white;
    transition:all .15s;
  }
  .qp-send:hover{background:var(--p2);box-shadow:0 0 18px var(--pglow)}
  .qp-send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
}

/* ══ TOASTS ═════════════════════════════════════════════════════════════ */
@layer components {
  #toasts{position:fixed;top:64px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
  .toast{
    display:flex;align-items:center;gap:10px;
    background:var(--sf2);border:1px solid var(--bd2);border-radius:var(--r);
    padding:10px 16px;font-size:13px;color:var(--tx);
    box-shadow:var(--sh);pointer-events:all;
    max-width:320px;
  }
  .toast.info {border-left:3px solid var(--p2)}
  .toast.success{border-left:3px solid var(--em)}
  .toast.warn  {border-left:3px solid var(--am)}
}

@layer utils {
  [hidden]{display:none !important}
  .mt16{margin-top:16px}
  .mb16{margin-bottom:16px}
  .mb24{margin-bottom:24px}
}
</style>
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>

<!-- ── Login ────────────────────────────────────────────────────────── -->
<div id="login">
  <div class="login-card">
    <div class="lg-gem">V</div>
    <div class="lg-title">Vantage</div>
    <div class="lg-sub">Manager Dashboard · Engineering Intelligence</div>
    <input id="tok-in" class="lg-input" type="password" placeholder="Enter manager token" autocomplete="off"/>
    <button class="lg-btn" onclick="doLogin()">Sign In</button>
    <div id="lg-err" class="lg-err"></div>
    <div class="lg-foot">Secure access to your team's engineering stream</div>
  </div>
</div>

<!-- ── App ──────────────────────────────────────────────────────────── -->
<div id="app" hidden>

  <header id="topbar">
    <div class="t-brand" onclick="nav('overview')">
      <div class="t-gem">V</div>
      <span>VANTAGE</span>
    </div>
    <div class="t-sep"></div>
    <div class="t-right">
      <div id="live-badge" class="live-badge" hidden>
        <div class="live-dot"></div>
        <span id="live-txt">0 online</span>
      </div>
      <div class="refresh-wrap" onclick="manualRefresh()" title="Refresh now">
        <svg id="ring-svg" width="28" height="28" viewBox="0 0 28 28">
          <circle class="ring-track" cx="14" cy="14" r="12"/>
          <circle id="ring-prog" class="ring-prog" cx="14" cy="14" r="12"/>
        </svg>
        <svg class="ring-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </div>
      <span id="t-clock" class="t-clock"></span>
      <button class="icon-btn" onclick="logout()" title="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <div id="shell">
    <aside id="sidebar">
      <div class="sb-sec">
        <div class="sb-lbl">Navigation</div>
        <div class="sb-item active" id="nav-ov" onclick="nav('overview')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </div>
      </div>
      <div class="sb-hr"></div>
      <div class="sb-sec">
        <div class="sb-lbl">Team</div>
        <div id="sb-devs"></div>
      </div>
      <div style="flex:1"></div>
      <div class="sb-hr"></div>
      <div class="sb-action" onclick="nav('search')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Semantic Search
      </div>
      <div class="sb-action" onclick="openQuery()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Ask AI
      </div>
    </aside>

    <main id="content">
      <div class="loading" id="init-load"><div class="spinner"></div> Loading dashboard…</div>
    </main>
  </div>
</div>

<!-- ── Modal ────────────────────────────────────────────────────────── -->
<div id="modal" hidden onclick="handleMClick(event)">
  <div class="modal-box">
    <div class="m-head">
      <div id="m-badge"></div>
      <div id="m-title" class="m-title"></div>
      <button class="m-close" onclick="closeModal()">×</button>
    </div>
    <div id="m-body" class="m-body"></div>
  </div>
</div>

<!-- ── Query Panel ───────────────────────────────────────────────────── -->
<div id="qpanel">
  <div class="qp-head">
    <div class="qp-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Ask AI
    </div>
    <button class="m-close" onclick="closeQuery()">×</button>
  </div>
  <div id="qp-msgs" class="qp-msgs">
    <div style="text-align:center;padding:36px 12px;color:var(--tx3);font-size:13px">
      <div style="font-size:32px;margin-bottom:10px;opacity:.35">🤖</div>
      Ask about commits, standups, blockers, PRs, or any team activity.
    </div>
  </div>
  <div class="qp-foot">
    <select id="qp-dev" class="qp-sel"><option value="">All developers</option></select>
    <div class="qp-row">
      <textarea id="qp-in" class="qp-ta" placeholder="Ask anything… (Enter to send)" rows="1" onkeydown="qKey(event)"></textarea>
      <button id="qp-send" class="qp-send" onclick="sendQ()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ── Toasts ────────────────────────────────────────────────────────── -->
<div id="toasts"></div>

<script>
'use strict';

/* ══ State ═════════════════════════════════════════════════════════ */
const S = {
  token:null, view:'overview',
  developers:[], activity:[], sparklines:{},
  status:{online_devs:[],total_devs:0,total_artifacts:0,artifacts_today:0},
  liveProbes:{},   // devId → ProbeResponse
  prevArtifactIds: new Set(),  // for new-artifact toast detection
};
let CUR_TL = [];          // current timeline items (index → item)
const STORE = new Map();  // approval_id → full item with payload
let RING_TIMER = null;

/* ══ Utilities ═════════════════════════════════════════════════════ */
function h(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ini(n){if(!n)return'?';const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase()}
function ago(iso){
  if(!iso)return'Never';
  const s=Math.floor((Date.now()-new Date(iso.endsWith('Z')?iso:iso+'Z'))/1000);
  if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';
}
function fmt(iso){
  if(!iso)return'–';
  return new Date(iso.endsWith('Z')?iso:iso+'Z')
    .toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDate(iso){
  if(!iso)return'–';
  return new Date(iso.endsWith('Z')?iso:iso+'Z')
    .toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

/* ══ Channel config ════════════════════════════════════════════════ */
const CH={
  commit_report: {label:'Commit', cls:'b-commit', color:'var(--em)',  acls:'ch-commit'},
  weekly_digest: {label:'Digest', cls:'b-digest', color:'var(--p2)',  acls:'ch-digest'},
  standup:       {label:'Standup',cls:'b-standup',color:'var(--am)',  acls:'ch-standup'},
  pr_draft:      {label:'PR',     cls:'b-pr',     color:'var(--vi)',  acls:'ch-pr'},
  live_probe:    {label:'Probe',  cls:'b-probe',  color:'var(--te)',  acls:'ch-probe'},
};
function chCfg(ch){return CH[(ch||'').toLowerCase()]||{label:(ch||'').toUpperCase(),cls:'b-default',color:'var(--tx2)',acls:''}}
function badge(ch){const c=chCfg(ch);return`<span class="badge ${c.cls}">${c.label}</span>`}
function chLabel(ch){return chCfg(ch).label}
function chColor(ch){return chCfg(ch).color}

/* ══ SVG Charts ════════════════════════════════════════════════════ */
function sparklineSVG(counts, color, w=120, h=28){
  const max=Math.max(...counts,1);
  const barW=Math.floor((w-(counts.length-1)*2)/counts.length);
  const bars=counts.map((v,i)=>{
    if(v===0)return`<rect x="${i*(barW+2)}" y="${h}" width="${barW}" height="0" rx="2" fill="${color}" opacity="0.15"/>`;
    const bh=Math.max(3,Math.round((v/max)*(h-4)));
    const y=h-bh;
    const op=(0.3+(v/max)*0.7).toFixed(2);
    return`<rect x="${i*(barW+2)}" y="${y}" width="${barW}" height="${bh}" rx="2" fill="${color}" opacity="${op}"/>`;
  }).join('');
  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible">${bars}</svg>`;
}

function activityChartSVG(counts){
  // Full-width responsive chart for the developer detail page
  const max=Math.max(...counts,1);
  const h=48;const padT=4;const padB=16;const innerH=h-padT-padB;
  const days=counts.length;
  const total=counts.reduce((a,b)=>a+b,0);
  const bars=counts.map((v,i)=>{
    const x=(i/(days-1||1)*90).toFixed(1)+'%';
    const barH=v===0?2:Math.max(4,Math.round((v/max)*innerH));
    const y=padT+(innerH-barH);
    const op=v===0?'0.12':(0.3+(v/max)*0.7).toFixed(2);
    const col=v===0?'var(--bd2)':'var(--p2)';
    return`<rect x="${x}" y="${y}" width="2.5%" height="${barH}" rx="2" fill="${col}" opacity="${op}"/>`;
  }).join('');
  const labels=counts.map((v,i)=>{
    if(i===0||i===Math.floor(days/2)||i===days-1){
      const x=(i/(days-1||1)*100).toFixed(1)+'%';
      return`<text x="${x}" y="${h}" text-anchor="middle" fill="var(--tx3)" font-size="9" font-family="Geist,system-ui">${fmtDate(relDay(i-(days-1)))}</text>`;
    }
    return'';
  }).join('');
  return{svg:`<svg viewBox="0 0 400 ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" class="act-chart-svg" preserveAspectRatio="none">${bars}${labels}</svg>`,total};
}

function relDay(offset){
  const d=new Date();d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}

/* ══ API ════════════════════════════════════════════════════════════ */
async function api(method,path,body){
  try{
    const r=await fetch('/ui/api'+path,{
      method,
      headers:{'Authorization':'Bearer '+S.token,'Content-Type':'application/json'},
      body:body!=null?JSON.stringify(body):undefined,
    });
    if(r.status===401){logout();return null}
    if(!r.ok){console.error('API',path,r.status);return null}
    return await r.json();
  }catch(e){console.error('API',path,e);return null}
}

/* ══ Auth ═══════════════════════════════════════════════════════════ */
async function doLogin(){
  const tok=document.getElementById('tok-in').value.trim();
  if(!tok){lgErr('Please enter your manager token');return}
  S.token=tok;
  const ok=await api('GET','/status');
  if(!ok){S.token=null;lgErr('Invalid token — check and try again');return}
  sessionStorage.setItem('vt',tok);
  launchApp();
}
function lgErr(msg){
  const el=document.getElementById('lg-err');el.textContent=msg;
  el.animate([{opacity:0,transform:'translateY(-4px)'},{opacity:1,transform:'none'}],{duration:200,fill:'forwards'});
  setTimeout(()=>el.textContent='',3500);
}
function logout(){
  S.token=null;sessionStorage.removeItem('vt');
  document.getElementById('app').hidden=true;
  document.getElementById('login').hidden=false;
  document.getElementById('tok-in').value='';
}

/* ══ Init ═══════════════════════════════════════════════════════════ */
async function init(){
  document.getElementById('tok-in').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();closeQuery()}
    if(e.key==='/'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openQuery()}
    if(e.key==='r'&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT')manualRefresh();
  });
  const saved=sessionStorage.getItem('vt');
  if(saved){
    S.token=saved;
    const ok=await api('GET','/status');
    if(ok){launchApp();return}
    S.token=null;
  }
  document.getElementById('login').hidden=false;
}

async function launchApp(){
  document.getElementById('login').hidden=true;
  document.getElementById('app').hidden=false;
  tickClock();setInterval(tickClock,15000);
  await loadAll();
  probeOnlineDevelopers();   // fire-and-forget, updates Working Now
  nav('overview');
  startRing();
  setInterval(autoRefresh,30000);
}

function tickClock(){
  document.getElementById('t-clock').textContent=
    new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

/* ══ Refresh ring ═══════════════════════════════════════════════════ */
const RING_CIRCUMFERENCE=75.4; // 2π×12
function startRing(){
  clearTimeout(RING_TIMER);
  const prog=document.getElementById('ring-prog');
  if(!prog)return;
  prog.style.transition='none';
  prog.style.strokeDashoffset=RING_CIRCUMFERENCE;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      prog.style.transition=`stroke-dashoffset 30s linear`;
      prog.style.strokeDashoffset='0';
    });
  });
}
async function autoRefresh(){
  await loadAll();
  probeOnlineDevelopers();
  if(S.view==='overview')renderOverview();
  startRing();
}
async function manualRefresh(){
  startRing();
  await loadAll();
  probeOnlineDevelopers();
  if(S.view==='overview')renderOverview();
  else if(S.view!=='overview')loadDev(S.view);
  toast('Dashboard refreshed','success');
}

/* ══ Data loading ═══════════════════════════════════════════════════ */
async function loadAll(){
  const prevTotal=S.status.total_artifacts;
  const [st,devs,act,sparks]=await Promise.all([
    api('GET','/status'),
    api('GET','/developers'),
    api('GET','/activity?limit=50'),
    api('GET','/sparklines?days=14'),
  ]);
  if(st)   S.status=st;
  if(devs) S.developers=devs;
  if(act){
    // Detect new artifacts
    const newIds=new Set((act||[]).map(i=>i.approval_id));
    if(S.prevArtifactIds.size>0){
      const fresh=(act||[]).filter(i=>!S.prevArtifactIds.has(i.approval_id));
      if(fresh.length>0){
        toast(`${fresh.length} new artifact${fresh.length>1?'s':''} received from ${fresh.map(f=>f.developer_name).join(', ')}`, 'info');
      }
    }
    S.prevArtifactIds=newIds;
    S.activity=act;
  }
  if(sparks)S.sparklines=sparks;
  updateLiveBadge();
  renderSidebar();
  fillDevSel();
}

async function probeOnlineDevelopers(){
  const online=S.status.online_devs||[];
  if(!online.length)return;
  // Show skeleton cards in "Working Now" section if on overview
  if(S.view==='overview'){
    const wnWrap=document.getElementById('wn-cards');
    if(wnWrap&&!wnWrap.dataset.loaded){
      wnWrap.innerHTML=online.map(()=>`
        <div class="wn-skeleton">
          <div class="sk-line med"></div><div class="sk-line short"></div>
          <div class="sk-line"></div><div class="sk-line med"></div>
        </div>`).join('');
    }
  }
  const probes=online.map(devId=>
    api('POST',`/probe/${encodeURIComponent(devId)}`,{}).then(r=>{
      if(r){S.liveProbes[devId]=r;updateWorkingNow(devId,r)}
    })
  );
  await Promise.all(probes);
}

function updateLiveBadge(){
  const n=(S.status.online_devs||[]).length;
  const el=document.getElementById('live-badge');
  if(n>0){el.hidden=false;document.getElementById('live-txt').textContent=n+' online'}
  else el.hidden=true;
}

/* ══ Navigation (View Transitions) ══════════════════════════════════ */
function nav(view){
  S.view=view;
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
  if(view==='overview')document.getElementById('nav-ov')?.classList.add('active');
  else document.querySelector(`[data-did="${view}"]`)?.classList.add('active');

  const go=()=>{
    if(view==='overview')renderOverview();
    else if(view==='search')renderSearch();
    else loadDev(view);
  };
  if(document.startViewTransition)document.startViewTransition(go);
  else go();
}

/* ══ Overview ════════════════════════════════════════════════════════ */
function renderOverview(){
  const online=new Set(S.status.online_devs||[]);
  const st=S.status;

  /* Stat cards */
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const statsHtml=`<div class="stat-row">
    ${statCard('Developers',st.total_devs,'','flat','')}
    ${statCard('Total Artifacts',st.total_artifacts,'','flat','')}
    ${statCard('Today',st.artifacts_today,'','flat','')}
    ${statCard('Online Now',`${(st.online_devs||[]).length}<sub> / ${st.total_devs}</sub>`,
      (st.online_devs||[]).length>0?'green':'','flat','')}
  </div>`;

  /* Working Now */
  const onlineDevs=S.developers.filter(d=>online.has(d.developer_id));
  const wnHtml=onlineDevs.length?`
    <div class="wn-section">
      <div class="wn-hdr">
        <div class="wn-title">Working Now</div>
        <div class="wn-live">Live</div>
      </div>
      <div class="wn-grid" id="wn-cards">
        ${onlineDevs.map(d=>{
          const probe=S.liveProbes[d.developer_id];
          return probe?wnCard(d,probe):wnSkeleton(d);
        }).join('')}
      </div>
    </div>`:'';

  /* Dev grid */
  const devGridHtml=S.developers.length?`
    <div class="sec-hdr mb16">
      <span>Team</span>
      <span class="muted">${S.developers.length} developers</span>
    </div>
    <div class="dev-grid">${S.developers.map(d=>devCard(d,online.has(d.developer_id))).join('')}</div>`:`
    <div class="empty">
      <div class="empty-ico">👥</div>
      <div class="empty-ttl">No developers yet</div>
      <div class="empty-txt">Run <code>shadow-replica import-dev</code> to add team members.</div>
    </div>`;

  /* Activity feed */
  const actHtml=S.activity.length?`
    <div class="sec-hdr">
      <span>Recent Activity</span>
      <span class="muted">${S.activity.length} items</span>
    </div>
    <div class="act-list" id="act-list">
      ${S.activity.slice(0,30).map(it=>`
        <div class="act-item ${chCfg(it.channel).acls}" onclick="openFromAct('${h(it.developer_id)}','${h(it.approval_id)}')">
          <div class="act-av">${h(ini(it.developer_name))}</div>
          ${badge(it.channel)}
          <div class="act-name">${h(it.developer_name)}</div>
          <div class="act-sum">${h(it.summary||'—')}</div>
          <div class="act-time">${ago(it.received_at)}</div>
        </div>`).join('')}
    </div>`:'';

  const el=document.getElementById('content');
  el.innerHTML=`
    <div class="ph"><div class="ph-title">Team Overview</div><div class="ph-sub">Live view of your engineering team</div></div>
    ${statsHtml}${wnHtml}${devGridHtml}${actHtml}`;
  document.getElementById('init-load').hidden=true;

  /* Animate stat numbers */
  el.querySelectorAll('.sc-val').forEach(sv=>animNum(sv));
  /* Stagger activity rows */
  staggerIn(el.querySelectorAll('.act-item'));
}

function statCard(lbl,val,extra,trend,trendTxt){
  const trendHtml=trendTxt?`<div class="sc-trend ${trend}">
    ${trend==='up'?'↑':trend==='dn'?'↓':''}${trendTxt}
  </div>`:'';
  return`<div class="stat-card"><div class="sc-lbl">${lbl}</div><div class="sc-val${extra?' '+extra:''}" data-target="${typeof val==='number'?val:''}">${val}</div>${trendHtml}</div>`;
}

function wnSkeleton(d){
  return`<div class="wn-skeleton" id="wn-${h(d.developer_id)}">
    <div class="sk-line med"></div><div class="sk-line short"></div>
    <div class="sk-line"></div><div class="sk-line med"></div>
  </div>`;
}

function wnCard(dev,probe){
  const sn=probe.snapshot;
  const decision=(probe.policy_decision||'').toLowerCase();
  const allowed=decision.includes('allow');
  const snap=allowed&&sn?sn:null;
  const as=snap?.activity_signals;
  const turns=snap?.last_turns||[];
  const lastTurn=turns[turns.length-1];
  const cwd=snap?.cwd||'';
  const cwdShort=cwd?cwd.split(/[\\/]/).slice(-2).join('/'):'';
  const agentKind=snap?.agent_kind||'';
  const excerpt=lastTurn?.content_excerpt||probe.fallback_summary||'';

  // Prefer activity signals rows over raw turn data
  const actRow=as?.primary_activity&&as.primary_activity!=='unknown'
    ?`<div class="wn-row"><span class="wn-row-lbl">Activity</span><span class="wn-row-val plain"><span class="act-badge act-${as.primary_activity}" style="font-size:10px;padding:1px 6px">${h(as.primary_activity)}</span>${as.inferred_branch?` <code style="font-family:var(--mono);font-size:11px;color:var(--te)">${h(as.inferred_branch)}</code>`:''}</span></div>`
    :'';
  const filesRow=as?.files_recently_touched?.length
    ?`<div class="wn-row"><span class="wn-row-lbl">Files</span><span class="wn-row-val plain" style="font-family:var(--mono);font-size:11.5px;color:var(--tx2)">${h(as.files_recently_touched.slice(0,3).join(', '))}</span></div>`
    :(cwdShort?`<div class="wn-row"><span class="wn-row-lbl">Dir</span><span class="wn-row-val">${h(cwdShort)}</span></div>`:'');
  const intentRow=as?.last_user_intent
    ?`<div class="wn-row"><span class="wn-row-lbl">Intent</span><span class="wn-row-val plain" style="color:var(--tx3);font-style:italic">"${h(as.last_user_intent.slice(0,80))}${as.last_user_intent.length>80?'…':''}"</span></div>`
    :(excerpt?`<div class="wn-row"><span class="wn-row-lbl">Last</span><span class="wn-row-val plain" style="color:var(--tx2)">${h(excerpt.slice(0,80))}${excerpt.length>80?'…':''}</span></div>`:'');

  return`<div class="wn-card" id="wn-${h(dev.developer_id)}">
    <div class="wn-top">
      <div class="wn-av">${h(ini(dev.name))}</div>
      <div><div class="wn-name">${h(dev.name)}</div><div class="wn-status">● Active session</div></div>
    </div>
    <div class="wn-rows">
      ${agentKind?`<div class="wn-row"><span class="wn-row-lbl">Agent</span><span class="wn-row-val plain">${h(agentKind)}</span></div>`:''}
      ${actRow}
      ${filesRow}
      ${intentRow}
    </div>
    <div class="wn-footer">
      <button class="wn-prob-btn" onclick="openProbeModal('${h(dev.developer_id)}');event.stopPropagation()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>
        View Full Session
      </button>
    </div>
  </div>`;
}

function updateWorkingNow(devId,probe){
  const el=document.getElementById('wn-'+devId);
  if(!el)return;
  const dev=S.developers.find(d=>d.developer_id===devId);
  if(!dev)return;
  el.outerHTML=wnCard(dev,probe);
}

/* ══ Dev card ════════════════════════════════════════════════════════ */
function devCard(d,isOn){
  const spark=S.sparklines[d.developer_id]||new Array(14).fill(0);
  const sparkSvg=sparklineSVG(spark,isOn?'var(--em)':'var(--p2)',120,24);
  const total=d.artifact_count||1;
  const counts=d.channel_counts||{};
  const distRows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([ch,cnt])=>{
    const pct=Math.round((cnt/total)*100);
    const cfg=chCfg(ch);
    return`<div class="ch-dist-row">
      <span class="badge ${cfg.cls}" style="font-size:10px;padding:1px 6px">${cfg.label}</span>
      <div class="ch-dist-bar-wrap"><div class="ch-dist-bar" style="width:${pct}%;background:${cfg.color}"></div></div>
      <span class="ch-dist-pct">${pct}%</span>
    </div>`;
  }).join('');
  const last=d.last_received_at?ago(d.last_received_at):'No activity';

  return`<div class="dev-card" onclick="nav('${h(d.developer_id)}')">
    <div class="dc-top">
      <div class="dc-av ${isOn?'on':''}">${h(ini(d.name))}</div>
      <div>
        <div class="dc-name">${h(d.name)}</div>
        <div class="dc-status ${isOn?'on':''}">${isOn?'● Online now':'○ '+last}</div>
      </div>
    </div>
    <div class="dc-spark">
      <div class="dc-spark-lbl">Activity · last 14 days</div>
      ${sparkSvg}
    </div>
    ${distRows?`<div class="ch-dist">${distRows}</div>`:''}
    <div class="dc-actions" onclick="event.stopPropagation()">
      <button class="btn-sm" onclick="nav('${h(d.developer_id)}')">Timeline</button>
      ${isOn
        ?`<button class="btn-sm teal" onclick="openProbeModal('${h(d.developer_id)}')">⚡ Probe</button>`
        :`<button class="btn-sm" disabled>Offline</button>`}
    </div>
  </div>`;
}

/* ══ Developer detail ════════════════════════════════════════════════ */
async function loadDev(devId){
  const online=new Set(S.status.online_devs||[]);
  const el=document.getElementById('content');
  el.innerHTML=`
    <div class="back-btn" onclick="nav('overview')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg>
      Overview
    </div>
    <div id="dev-inner"><div class="loading"><div class="spinner"></div> Loading…</div></div>`;

  const data=await api('GET',`/timeline/${encodeURIComponent(devId)}?limit=60`);
  if(!data){
    document.getElementById('dev-inner').innerHTML='<div class="empty"><div class="empty-ttl">Could not load data</div></div>';
    return;
  }

  CUR_TL=data.items||[];
  CUR_TL.forEach(it=>STORE.set(it.approval_id,it));

  const isOn=data.is_online||online.has(devId);
  const name=data.developer_name||devId;

  /* Activity chart */
  const spark=S.sparklines[devId]||new Array(14).fill(0);
  const{svg:chartSvg,total:chartTotal}=activityChartSVG(spark);
  const chartDays=spark.filter(v=>v>0).length;

  /* Channel distribution */
  const devObj=S.developers.find(d=>d.developer_id===devId);
  const counts=devObj?.channel_counts||{};
  const countTotal=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const chDistRows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([ch,cnt])=>{
    const pct=Math.round((cnt/countTotal)*100);
    const cfg=chCfg(ch);
    return`<div class="ch-dist-full-row">
      <span class="badge ${cfg.cls}" style="min-width:70px;justify-content:center">${cfg.label}</span>
      <div class="ch-dist-full-bar-wrap"><div class="ch-dist-full-bar" style="width:${pct}%;background:${cfg.color}"></div></div>
      <span class="ch-dist-full-pct">${pct}%</span>
      <span class="ch-dist-full-count">${cnt}</span>
    </div>`;
  }).join('');

  /* Channel tabs */
  const channels=['all',...new Set(CUR_TL.map(i=>i.channel.toLowerCase()))];
  const tabsHtml=channels.map(ch=>
    `<div class="ch-tab${ch==='all'?' active':''}" data-ch="${h(ch)}" onclick="switchTab('${h(ch)}',this)">
       ${ch==='all'?`All (${CUR_TL.length})`:chLabel(ch)}
     </div>`).join('');

  const probeResult=S.liveProbes[devId];
  const currentActivity=probeResult?.snapshot?.cwd?

function renderTL(items){

/* ══ Artifacts ═══════════════════════════════════════════════════════ */
function openTLItem(idx){const it=CUR_TL[idx];if(it)showArtifact(it)}

async function openFromAct(devId,approvalId){
  if(STORE.has(approvalId)){showArtifact(STORE.get(approvalId));return}
  showModal(badge(''),'Loading…','<div class="loading"><div class="spinner"></div> Fetching…</div>');
  const data=await api('GET',`/timeline/${encodeURIComponent(devId)}?limit=100`);
  if(data){
    data.items.forEach(it=>STORE.set(it.approval_id,it));
    const found=STORE.get(approvalId);
    if(found){showArtifact(found);return}
  }
  document.getElementById('m-body').innerHTML='<div class="empty"><div class="empty-ttl">Not found</div></div>';
}

function showArtifact(item){
  const ch=(item.channel||'').toLowerCase();
  showModal(badge(ch),item.artifact_type||chLabel(ch),buildArtifactHtml(ch,item.payload||{},item));
}

/* ══ Artifact HTML builder ══════════════════════════════════════════ */
function codeBlock(code,id){
  return`<div class="a-code-block" id="cb-${id}"><pre style="margin:0;white-space:pre-wrap;word-break:break-all">${h(code)}</pre>
    <button class="copy-btn" onclick="copyBlock('${id}','${h(code.slice(0,200))}',this)">Copy</button>
  </div>`;
}
function copyBlock(id,text,btn){
  navigator.clipboard?.writeText(text).then(()=>{
    btn.textContent='Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},2000);
  });
}
function sec(lbl,body,cls){return`<div class="a-sec"><div class="a-lbl${cls?' '+cls:''}">${lbl}</div>${body}</div>`}
function blist(arr,itemCls){
  if(!arr?.length)return'';
  return`<ul class="a-list">${arr.map(x=>`<li${itemCls?' class="'+itemCls+'"':''}>${h(x)}</li>`).join('')}</ul>`;
}
function fileTags(files){
  if(!files?.length)return'';
  return`<div class="file-tags">${files.map(f=>`<span class="file-tag">${h(f)}</span>`).join('')}</div>`;
}
function metaRow(item){
  return`<div class="a-meta">
    <div class="a-mi"><div class="a-ml">Received</div><div class="a-mv">${fmt(item.received_at)}</div></div>
    <div class="a-mi"><div class="a-ml">Approved</div><div class="a-mv">${fmt(item.approved_at)}</div></div>
    <div class="a-mi"><div class="a-ml">ID</div><div class="a-mv"><code>${h((item.approval_id||'').slice(0,14))}…</code></div></div>
  </div>`;
}

function buildArtifactHtml(ch,p,meta){
  let body='';
  const uid=Math.random().toString(36).slice(2,8);

  if(ch==='commit_report'){
    body=[
      p.generated_summary&&sec('AI Summary',`<div class="a-text">${h(p.generated_summary)}</div>`),
      p.author_msg&&sec('Commit Message',`<div class="a-text" style="font-size:14px;font-weight:500;color:var(--tx)">${h(p.author_msg)}</div>`),
      p.commit_sha&&sec('SHA',codeBlock(p.commit_sha,uid+'sha')),
      (p.repo||p.branch)&&sec('Branch',`
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${p.repo?`<span class="file-tag">${h(p.repo)}</span>`:''}
          ${p.branch?`<span class="file-tag" style="border-color:var(--pbd);color:var(--p2)">${h(p.branch)}</span>`:''}
        </div>`),
      p.diff_stat&&sec('Diff Stat',codeBlock(p.diff_stat,uid+'diff')),
      p.files_touched?.length&&sec(`Files Changed (${p.files_touched.length})`,fileTags(p.files_touched)),
      p.open_questions?.length&&sec('Open Questions',blist(p.open_questions)),
    ].filter(Boolean).join('');
  }else if(ch==='weekly_digest'){
    const period=p.period_start?`${fmtDate(p.period_start)} – ${fmtDate(p.period_end)}`:'';
    body=[
      period&&sec('Period',`<div style="display:inline-flex;align-items:center;background:var(--pbg);border:1px solid var(--pbd);border-radius:6px;padding:4px 12px;font-size:13px;color:var(--p2)">${h(period)}</div>`),
      p.highlights?.length&&sec('Highlights',blist(p.highlights)),
      p.commits?.length&&sec(`Commits (${p.commits.length})`,blist(p.commits)),
      p.open_threads?.length&&sec('Open Threads',blist(p.open_threads)),
      p.blockers?.length&&sec('Blockers',blist(p.blockers,'danger'),'danger'),
      p.next_week?.length&&sec('Next Week',blist(p.next_week)),
    ].filter(Boolean).join('');
  }else if(ch==='standup'){
    body=[
      p.yesterday?.length&&sec('Yesterday',blist(p.yesterday)),
      p.today?.length&&sec('Today',blist(p.today)),
      sec('Blockers',p.blockers?.length?blist(p.blockers,'warn'):`<div class="a-text" style="color:var(--tx3)">None 🎉</div>`,p.blockers?.length?'warn':''),
    ].filter(Boolean).join('');
  }else if(ch==='pr_draft'){
    body=[
      p.title&&sec('Title',`<div class="a-title">${h(p.title)}</div>`),
      (p.branch||p.base)&&sec('Branch',
        `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="file-tag" style="border-color:var(--embd);color:var(--em)">${h(p.branch||'?')}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--tx3)" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>
          <span class="file-tag" style="border-color:var(--ambd);color:var(--am)">${h(p.base||'main')}</span>
        </div>`),
      p.summary&&sec('Summary',`<div class="a-text">${h(p.summary)}</div>`),
      p.rationale&&sec('Rationale',`<div class="a-text">${h(p.rationale)}</div>`),
      p.test_notes&&sec('Testing Notes',`<div class="a-text">${h(p.test_notes)}</div>`),
      p.risk_notes&&sec('Risk Notes',`<div class="a-text">${h(p.risk_notes)}</div>`,'warn'),
    ].filter(Boolean).join('');
  }else if(ch==='live_probe'){
    body=buildProbeHtml(p);
  }else{
    body=sec('Payload',codeBlock(JSON.stringify(p,null,2),uid+'raw'));
  }
  return body+metaRow(meta);
}

/* ══ Probe ═══════════════════════════════════════════════════════════ */
async function openProbeModal(devId){
  const dev=S.developers.find(d=>d.developer_id===devId);
  const name=dev?.name||devId;
  showModal(badge('probe'),`Live Session · ${h(name)}`,
    '<div class="loading"><div class="spinner"></div> Probing developer session…</div>');

  const r=await api('POST',`/probe/${encodeURIComponent(devId)}`,{});
  if(!r){
    document.getElementById('m-body').innerHTML='<div class="empty"><div class="empty-ttl">Probe failed</div><div class="empty-txt">Could not reach the developer session.</div></div>';
    return;
  }
  S.liveProbes[devId]=r;
  if(S.view==='overview')updateWorkingNow(devId,r);
  document.getElementById('m-body').innerHTML=buildProbeHtml(r);
}

function buildProbeHtml(p){
  const dec=(p.policy_decision||'unknown').toLowerCase().replace(/_/g,' ');
  const ok=dec.includes('allow');const no=dec.includes('deny');
  const cls=ok?'ps-ok':no?'ps-no':'ps-off';
  const icon=ok?'✓':no?'✗':'○';
  let html=`<div class="probe-status ${cls}">
    <strong>${icon} ${dec}</strong>
    ${p.staleness_seconds>0?`<span style="font-size:12px;opacity:.7;margin-left:8px">${Math.round(p.staleness_seconds/60)}m stale</span>`:''}
  </div>`;
  if(p.fallback_summary)html+=sec('Summary',`<div class="a-text">${h(p.fallback_summary)}</div>`);
  const sn=p.snapshot;
  if(sn){
    const as=sn.activity_signals;
    if(as&&(as.primary_activity!=='unknown'||as.files_recently_touched?.length||as.last_user_intent)){
      const act=as.primary_activity||'unknown';
      const actCls=`act-${act.toLowerCase()}`;
      const filesHtml=(as.files_recently_touched||[]).slice(0,6).map(f=>`<span class="file-tag">${h(f)}</span>`).join('');
      const branchHtml=as.inferred_branch?`<code style="font-family:var(--mono);font-size:11.5px;background:var(--bg);padding:2px 7px;border-radius:4px;color:var(--te);margin-left:6px">${h(as.inferred_branch)}</code>`:'';
      html+=sec('Current Activity',`<div class="probe-act">
        <div class="probe-act-row"><span class="pa-lbl">Status</span><span class="act-badge ${actCls}">${h(act)}</span>${branchHtml}</div>
        ${filesHtml?`<div class="probe-act-row"><span class="pa-lbl">Files</span><div class="file-tags pa-val">${filesHtml}</div></div>`:''}
        ${as.active_repo?`<div class="probe-act-row"><span class="pa-lbl">Repo</span><span class="pa-val" style="font-family:var(--mono);font-size:12px">${h(as.active_repo)}</span></div>`:''}
        ${as.last_user_intent?`<div class="probe-act-row"><span class="pa-lbl">Intent</span><span class="pa-intent">"${h(as.last_user_intent.slice(0,120))}"</span></div>`:''}
      </div>`);
    }
    if(sn.cwd)html+=sec('Working Directory',`<div class="a-code-block"><pre style="margin:0">${h(sn.cwd)}</pre></div>`);
    if(sn.last_turns?.length){
      const turns=sn.last_turns.map((t,i)=>{
        const rc=t.role==='user'?'tr-user':t.role==='assistant'?'tr-assistant':'tr-tool';
        const lbl=t.tool_name?`Tool: ${t.tool_name}`:t.role;
        return`<div class="turn" style="animation-delay:${i*50}ms">
          <div class="turn-role ${rc}">${h(lbl)}</div>
          <div class="turn-body">${h(t.content_excerpt||'')}</div>
          ${t.timestamp?`<div class="turn-ts">${fmt(t.timestamp)}</div>`:''}
        </div>`;
      }).join('');
      html+=sec(`Session Turns (${sn.last_turns.length})`,`<div class="turn-list">${turns}</div>`);
    }
  }
  return html;
}

async function sendQ(){
  const ta=document.getElementById('qp-in');
  const q=ta.value.trim();if(!q)return;
  const devId=document.getElementById('qp-dev').value||null;
  ta.value='';
  appendQ('you',q);
  const lid='ql'+Date.now();
  document.getElementById('qp-msgs').insertAdjacentHTML('beforeend',
    `<div id="${lid}" class="qmsg ai"><div class="qmsg-role">Assistant</div><div class="qbubble" style="color:var(--tx3)"><div class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></div></div></div>`);
  scrollQ();

function appendQ(role,text){

  document.getElementById('qp-msgs').insertAdjacentHTML('beforeend',
    `<div class="qmsg ${role}"><div class="qmsg-role">${lbl}</div><div class="qbubble">${h(text)}</div></div>`);

/* ══ Toasts ══════════════════════════════════════════════════════════ */
function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  el.animate([{opacity:0,transform:'translateX(12px)'},{opacity:1,transform:'none'}],{duration:250,fill:'forwards'});
  setTimeout(()=>{
    el.animate([{opacity:1},{opacity:0,transform:'translateX(12px)'}],{duration:200,fill:'forwards'}).onfinish=()=>el.remove();
  },4000);
}

/* ══ Animations ══════════════════════════════════════════════════════ */
function animNum(el){
  const raw=el.dataset.target||el.textContent;
  const target=parseInt(raw,10);
  if(isNaN(target)||target===0)return;
  const sub=el.querySelector('sub');
  const subHtml=sub?sub.outerHTML:'';
  const dur=Math.min(900,target*12);
  const start=performance.now();
  const step=now=>{
    const p=Math.min((now-start)/dur,1);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(eased*target);
    if(subHtml)el.insertAdjacentHTML('beforeend',subHtml);
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function staggerIn(items){
  if(!items.length)return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const el=entry.target;
        const idx=Array.from(items).indexOf(el);
        el.animate(
          [{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],
          {duration:260,delay:idx*35,fill:'forwards',easing:'cubic-bezier(.16,1,.3,1)'}
        );
        obs.unobserve(el);
      }
    });
  },{threshold:.05});
  items.forEach(el=>obs.observe(el));
}

function renderSearch(){
  const el=document.getElementById('content');
  el.innerHTML=`
<div style="max-width:800px;margin:0 auto;padding:24px 20px">
  <div style="margin-bottom:24px">
    <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">Semantic Search</h2>
    <p style="color:var(--tx3);font-size:13px">Search across all approved artifacts using natural language. Powered by Qdrant vector search.</p>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <input id="srch-q" type="text" placeholder="e.g. authentication refactor last week…"
      style="flex:1;padding:10px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:14px"
      onkeydown="if(event.key==='Enter')runSearch()"/>
    <select id="srch-dev" style="padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);font-size:13px">
      <option value="">All developers</option>
      ${S.developers.map(d=>`<option value="${h(d.developer_id)}">${h(d.name)}</option>`).join('')}
    </select>
    <button onclick="runSearch()" style="padding:10px 20px;background:linear-gradient(135deg,var(--p),oklch(58% .200 280));color:#fff;border-radius:var(--r);font-size:14px;font-weight:600">Search</button>
  </div>
  <div id="srch-results" style="display:flex;flex-direction:column;gap:12px"></div>
</div>`;
  document.getElementById('srch-q').focus();
}

async function runSearch(){
  const q=document.getElementById('srch-q')?.value?.trim();
  const devId=document.getElementById('srch-dev')?.value||'';
  if(!q)return;

  const el=document.getElementById('srch-results');
  el.innerHTML='<div class="loading" style="padding:20px 0"><div class="spinner"></div> Searching…</div>';

  const params=new URLSearchParams({q,limit:12});
  if(devId)params.set('developer_id',devId);

  const data=await api('GET',`/search?${params}`);
  if(!data||data.error){el.innerHTML=`<div style="color:var(--re);padding:16px">${data?.error||'Search failed'}</div>`;return;}

  const results=data.results||[];
  if(!results.length){el.innerHTML='<div style="color:var(--tx3);padding:16px">No matching artifacts found.</div>';return;}

  el.innerHTML=results.map(r=>{
    const score=r.score!=null?`<span style="font-size:11px;color:var(--tx3);margin-left:8px">${(r.score*100).toFixed(1)}% match</span>`:'';
    const ts=(r.received_at||'').slice(0,19).replace('T',' ');
    const summary=r.summary||r.artifact_type;
    const badge=`<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--pbg);color:var(--p)">${h(r.channel||r.artifact_type)}</span>`;
    return `<div style="padding:16px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${badge}
        <span style="font-size:12px;color:var(--tx3)">${h(r.developer_name||r.developer_id)}</span>
        ${score}
        <span style="margin-left:auto;font-size:11px;color:var(--tx3)">${ts}</span>
      </div>
      <div style="font-size:14px">${h(summary)}</div>
    </div>`;
  }).join('');
}
